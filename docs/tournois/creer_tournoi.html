<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un Tournoi</title>
    <style>
        :root {
            --labelwidth: 100px;
        }


        .form-categorie {
            display: flex;
            flex-wrap: wrap;
            max-width: 600px;
            gap: 10px;
        }

        .form-container {
            max-width: 80%;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #f9f9f9;
        }

        .form-group {
            width: 100%;
            margin-bottom: 15px;
        }

        .form-group label {
            display: inline-block;
            margin-bottom: 5px;
            width: var(--labelwidth);
        }

        .empty {
            background-color: #979797;
        }

        .form-group input:disabled,
        .form-categorie input:disabled {
            background-color: #c7c7c7;
        }

        .form-categorie input {
            /*width: 100%;*/
            padding: 6px;
            box-sizing: border-box;
        }

       .form-group input {
            width: calc(100% - var(--labelwidth) - 10px);
            padding: 6px;
            box-sizing: border-box;
        }

        .form-group button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .form-group button:hover {
            background-color: #0056b3;
        }

        .label-categorie {
            width: 6em;
            display: inline-block;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Créer un Tournoi</h2>
        <form id="tournoiForm">
            <div class="form-group">
                <label for="mail">Mail *</label>
                <input type="text" id="mail" name="mail">
            </div>
            <div class="form-group">
                <label for="club">Club *</label>
                <input type="text" id="club" name="club" required>
            </div>
            <div style="display: flex;"">
                <div class="form-group" style="margin-right: 2em;">
                    <label for="date">Date *</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <div class="form-group">
                    <label for="date-limite">Date limite</label>
                    <input type="date" id="date-limite" name="date_limite">
                </div>
            </div>
            <div>
                <label>Catégories</label>
                <div id="form-categorie" class="form-categorie">

                    <!-- <table id="table-categorie">
                        <tr>
                            <th>Categorie</th>
                            <th>Niveau</th>
                        </tr>
                    </table> -->
                </div>
            </div>
            <div class="form-group">
                <button type="submit">Générer</button>
            </div>
        </form>
    </div>
    <div class="result-container" id="resultContainer">
        <h3>Résultat du formulaire</h3>
        <pre id="result"></pre>
    </div>
    <script>

        const CATEGORIES = [
            "Seniors M",
            "Seniors F",
            "U21M",
            "U21F",
            "U18M",
            "U18F",
            "U15M",
            "U15F",
            "U13M",
            "U13F",
            "U11M",
            "U11F",
            "U9M",
            "U9F",
            "U7",
            "Loisir",
        ]

        function ajouterOption(selectId, valeur, texte) {
            const select = document.getElementById(selectId);
            const option = document.createElement('option');
            option.value = valeur;
            option.text = texte;
            select.appendChild(option);
        }

        function ajouterCategorie(categorie) {
            const label_categorie = document.createElement('label');
            label_categorie.innerHTML = categorie;
            label_categorie.className = "label-categorie";

            const input_categorie = document.createElement('input');
            input_categorie.type = "text";
            input_categorie.id = "niveau-" + categorie;
            input_categorie.name = "niveau-" + categorie;
       
            const div_categorie = document.createElement('div');
            div_categorie.appendChild(label_categorie);
            div_categorie.appendChild(input_categorie);
            input_categorie.classList.add('empty');

            const form_categorie = document.getElementById("form-categorie");
            form_categorie.appendChild(div_categorie);

            input_categorie.addEventListener('keyup', function (event) {
                text = event.target.value;
                if (text.length > 0) {
                    event.target.classList.remove('empty');
                } else {
                    event.target.classList.add('empty');
                }

            });
        }

        // Inverse la date du format anglais (yyyy-mm-dd) au format français (dd-mm-yyyy)
        function date_to_text(date) {
            return date.split("-").reverse().join("/");
        }

        document.addEventListener('DOMContentLoaded', function () {
            for (categorie of CATEGORIES) {
                ajouterCategorie(categorie);
            }
        });

        document.getElementById('tournoiForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const formData = new FormData(event.target);

            
            
            const formObject = {};
            categories = []
            formData.forEach((value, key) => {
                if (key.startsWith("date")) {
                    formObject[key] = date_to_text(value);
                } else if (!key.startsWith("niveau-")) {
                    formObject[key] = value;
                }  else {
                    if (value.length > 0) {
                        categories.push({ categorie: key.replace("niveau-", ""), niveau: value });
                    }
                }

            });
            formObject.categories = categories;

            const resultContainer = document.getElementById('result');
            resultContainer.textContent = JSON.stringify(formObject, null, 2);
            navigator.clipboard.writeText(resultContainer.textContent);
        });
    </script>
</body>

</html>
